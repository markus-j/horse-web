<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ponit esteillä</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: system-ui, sans-serif;
      background: #7ec8f5;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .ruutu {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box;
      background: rgba(255, 255, 255, 0.75);
    }
    .piilossa { display: none; }
    h1 { font-size: 2.4rem; margin: 0 0 8px; color: #3a2a10; }
    p  { font-size: 1.4rem; margin: 4px 0; color: #3a2a10; }
    .lippu { font-size: 6rem; line-height: 1.1; }
    button {
      margin-top: 24px;
      font-size: 2rem; font-weight: bold;
      min-width: 220px; min-height: 80px;
      border: none; border-radius: 40px;
      background: #2fa84f; color: white;
      box-shadow: 0 6px 0 #1d7a36;
      touch-action: manipulation;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d7a36; }
    .korttirivi {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      width: 100%; max-width: 560px; margin-top: 12px;
    }
    @media (max-width: 480px) { .korttirivi { grid-template-columns: repeat(2, 1fr); } }
    .ponikortti {
      margin: 0; min-width: 0; min-height: 0; padding: 6px 4px 10px;
      border-radius: 20px; background: #d6eefc; color: #3a2a10;
      box-shadow: 0 5px 0 #c9b48a; font-size: 1.15rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .ponikortti:active { box-shadow: 0 1px 0 #c9b48a; }
    .ponikortti canvas { width: 120px; height: 100px; }
  </style>
</head>
<body>
  <canvas id="kangas"></canvas>

  <div id="alku" class="ruutu">
    <canvas id="kuvake" width="200" height="170" style="width:200px;height:170px"></canvas>
    <h1>Ponit esteillä</h1>
    <p>Napauta, niin poni hyppää!</p>
    <button id="aloitaNappi">Aloita</button>
  </div>

  <div id="paikkaRuutu" class="ruutu piilossa">
    <h1>Valitse paikka</h1>
    <div id="paikkarivi" class="korttirivi"></div>
  </div>

  <div id="valinta" class="ruutu piilossa">
    <h1>Valitse poni</h1>
    <div id="ponirivi" class="korttirivi"></div>
  </div>

  <div id="satulaRuutu" class="ruutu piilossa">
    <h1>Satulan kanssa vai ilman?</h1>
    <button id="satulaKanssa">Satulan kanssa</button>
    <button id="satulaIlman">Ilman satulaa</button>
  </div>

  <div id="loppu" class="ruutu piilossa">
    <div id="loppuKuva" class="lippu">🏁</div>
    <h1 id="loppuOtsikko">Maali!</h1>
    <p id="loppuTeksti"></p>
    <button id="uudestaanNappi">Aloita</button>
  </div>

  <script>
    // ---- Säännöt määrittelystä (MAARITTELY.md) ----
    const ESTEITA = 10;          // sääntö 5: rata, jossa 10 estettä
    const PISTEET_KIELTO = 1;    // sääntö 4
    const KIELLOT_LOPPU = 3;     // sääntö 6
    // säännöt 8–10: uudet esteet
    const PISTEET = {
      tavallinen: { hyva: 10, huono: 5 },
      vesi:       { hyva: 10, huono: 5 },   // huono = "Polskis!"
      korkea:     { hyva: 20, huono: 10 },  // myös okserin esteet
    };
    const LAJIT = ['tavallinen', 'vesi', 'korkea', 'okseri']; // sääntö 7: arvotaan
    // ---- Paikat (säännöt 22–23) ----
    // tausta(c, W, Y): piirtää paikan kuvan taivaalle. W = leveys, Y = maan korkeus (horisontti)
    function piirraEiffel(c, W, Y) {
      const h = Math.min(Y * 0.6, W * 0.8), x = W * 0.74, b = h * 0.26;
      c.fillStyle = '#6b5640';
      c.beginPath();
      c.moveTo(x - b, Y);
      c.quadraticCurveTo(x - b * 0.35, Y - h * 0.35, x - b * 0.1, Y - h * 0.82);
      c.lineTo(x + b * 0.1, Y - h * 0.82);
      c.quadraticCurveTo(x + b * 0.35, Y - h * 0.35, x + b, Y);
      c.closePath(); c.fill();
      // kaari jalkojen välissä
      c.fillStyle = '#7ec8f5';
      c.beginPath(); c.moveTo(x - b * 0.62, Y);
      c.quadraticCurveTo(x, Y - h * 0.32, x + b * 0.62, Y); c.closePath(); c.fill();
      // tasanteet ja huippu
      c.fillStyle = '#5a4734';
      c.fillRect(x - b * 0.68, Y - h * 0.3, b * 1.36, h * 0.03);
      c.fillRect(x - b * 0.34, Y - h * 0.58, b * 0.68, h * 0.025);
      c.fillRect(x - b * 0.14, Y - h * 0.84, b * 0.28, h * 0.02);
      c.strokeStyle = '#5a4734'; c.lineWidth = Math.max(2, h * 0.015);
      c.beginPath(); c.moveTo(x, Y - h * 0.84); c.lineTo(x, Y - h); c.stroke();
      // ristikko
      c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 1;
      for (let i = 1; i < 8; i++) {
        const yy = Y - h * 0.82 * i / 8, w = b * (1 - i / 8) * 0.9;
        c.beginPath(); c.moveTo(x - w, yy); c.lineTo(x + w * 0.6, yy - h * 0.08); c.stroke();
      }
    }
    function piirraNewYork(c, W, Y) {
      const h = Math.min(Y * 0.6, W * 0.85);
      const korkeudet = [0.5, 0.78, 0.6, 0.95, 0.55, 0.7];
      const lev = W * 0.095;
      korkeudet.forEach((k, i) => {
        const x = W * 0.02 + i * lev * 1.02, hh = h * k;
        c.fillStyle = i % 2 ? '#8e9fb6' : '#73859f';
        c.fillRect(x, Y - hh, lev, hh);
        c.fillStyle = 'rgba(255,240,170,0.8)';
        const ik = lev / 5;
        for (let yy = Y - hh + ik; yy < Y - ik * 2; yy += ik * 1.8)
          for (let xx = x + ik * 0.7; xx < x + lev - ik; xx += ik * 1.6) c.fillRect(xx, yy, ik * 0.7, ik * 0.8);
      });
      // Vapaudenpatsas
      const ph = Math.min(Y * 0.55, W * 0.6), x = W * 0.82;
      c.fillStyle = '#a89c86';
      c.fillRect(x - ph * 0.13, Y - ph * 0.35, ph * 0.26, ph * 0.35);
      c.fillStyle = '#5fa38c';
      c.beginPath();
      c.moveTo(x - ph * 0.09, Y - ph * 0.35); c.lineTo(x - ph * 0.045, Y - ph * 0.78);
      c.lineTo(x + ph * 0.045, Y - ph * 0.78); c.lineTo(x + ph * 0.09, Y - ph * 0.35);
      c.closePath(); c.fill();
      c.beginPath(); c.arc(x, Y - ph * 0.82, ph * 0.045, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#5fa38c'; c.lineWidth = Math.max(2, ph * 0.035); c.lineCap = 'round';
      c.beginPath(); c.moveTo(x + ph * 0.04, Y - ph * 0.74); c.lineTo(x + ph * 0.09, Y - ph * 0.98); c.stroke();
      c.lineWidth = Math.max(1, ph * 0.012);
      for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.4;
        c.beginPath(); c.moveTo(x, Y - ph * 0.85);
        c.lineTo(x + Math.cos(a) * ph * 0.09, Y - ph * 0.85 + Math.sin(a) * ph * 0.09); c.stroke();
      }
      c.fillStyle = '#ffb300';
      c.beginPath(); c.arc(x + ph * 0.09, Y - ph * 1.01, ph * 0.03, 0, Math.PI * 2); c.fill();
    }
    function piirraKuusi(c, x, Y, h) {
      c.fillStyle = '#6b4423';
      c.fillRect(x - h * 0.04, Y - h * 0.15, h * 0.08, h * 0.15);
      for (let i = 0; i < 3; i++) {
        c.fillStyle = i % 2 ? '#2e6b3a' : '#245a30';
        const yy = Y - h * 0.1 - i * h * 0.28, w = h * (0.32 - i * 0.07);
        c.beginPath(); c.moveTo(x - w, yy); c.lineTo(x, yy - h * 0.45); c.lineTo(x + w, yy); c.closePath(); c.fill();
      }
    }
    function piirraMetsa(c, W, Y) {
      const m = Math.min(Y, W * 1.2);
      [[0.06, 0.42], [0.22, 0.58], [0.4, 0.46], [0.57, 0.62], [0.74, 0.44], [0.92, 0.56]]
        .forEach(([x, k]) => piirraKuusi(c, W * x, Y, m * k));
    }
    function piirraMokki(c, x, Y, w) {
      const h = w * 0.6;
      c.fillStyle = '#b0302a'; c.fillRect(x - w / 2, Y - h, w, h);
      c.fillStyle = '#fff';
      c.fillRect(x - w / 2, Y - h, w * 0.05, h); c.fillRect(x + w / 2 - w * 0.05, Y - h, w * 0.05, h);
      c.fillRect(x - w * 0.3, Y - h * 0.65, w * 0.2, w * 0.18);
      c.fillRect(x + w * 0.08, Y - h * 0.7, w * 0.18, h * 0.7);
      c.fillStyle = '#7a1f1a'; c.fillRect(x + w * 0.11, Y - h * 0.64, w * 0.12, h * 0.64);
      c.fillStyle = '#3b3b3b';
      c.beginPath(); c.moveTo(x - w * 0.58, Y - h); c.lineTo(x, Y - h - w * 0.38); c.lineTo(x + w * 0.58, Y - h); c.closePath(); c.fill();
    }
    function piirraRuotsi(c, W, Y) {
      const m = Math.min(W, Y * 1.3);
      piirraMokki(c, W * 0.18, Y, m * 0.3);
      piirraMokki(c, W * 0.55, Y, m * 0.22);
      piirraMokki(c, W * 0.85, Y, m * 0.34);
    }
    function piirraTanska(c, W, Y) {
      const m = Math.min(W, Y * 1.3), x = W * 0.6, lev = m * 0.62, h = m * 0.22;
      const muuri = '#d8c9a8', torni = '#cbb994', katto = '#5fa38c';
      c.fillStyle = muuri; c.fillRect(x - lev / 2, Y - h, lev, h);
      for (let i = 0; i < 9; i++) c.fillRect(x - lev / 2 + i * lev / 8.5, Y - h - h * 0.12, lev / 17, h * 0.12);
      const tornit = [[-lev / 2, 1.5, 0.1], [lev / 2, 1.5, 0.1], [0, 2.2, 0.12]];
      for (const [dx, k, tw] of tornit) {
        const tx = x + dx, th = h * k, w = m * tw;
        c.fillStyle = torni; c.fillRect(tx - w / 2, Y - th, w, th);
        c.fillStyle = katto;
        c.beginPath(); c.moveTo(tx - w * 0.65, Y - th); c.lineTo(tx, Y - th - h * 0.9); c.lineTo(tx + w * 0.65, Y - th); c.closePath(); c.fill();
        c.fillStyle = '#4a3a2a'; c.fillRect(tx - w * 0.15, Y - th * 0.7, w * 0.3, w * 0.4);
      }
      // portti
      c.fillStyle = '#4a3a2a';
      c.beginPath(); c.moveTo(x - h * 0.2, Y); c.lineTo(x - h * 0.2, Y - h * 0.4);
      c.arc(x, Y - h * 0.4, h * 0.2, Math.PI, 0); c.lineTo(x + h * 0.2, Y); c.closePath(); c.fill();
      // Tanskan lippu keskitornin huipulla
      const lx = x, ly = Y - h * 2.2 - h * 0.9;
      c.strokeStyle = '#333'; c.lineWidth = Math.max(1, m * 0.006);
      c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx, ly - h * 0.5); c.stroke();
      const fw = h * 0.42, fh = h * 0.28, fy = ly - h * 0.5;
      c.fillStyle = '#c8102e'; c.fillRect(lx, fy, fw, fh);
      c.fillStyle = '#fff'; c.fillRect(lx + fw * 0.3, fy, fw * 0.12, fh); c.fillRect(lx, fy + fh * 0.44, fw, fh * 0.12);
    }
    function piirraPalmu(c, x, Y, h) {
      c.strokeStyle = '#8a5a2b'; c.lineWidth = h * 0.06; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, Y); c.quadraticCurveTo(x + h * 0.15, Y - h * 0.5, x + h * 0.08, Y - h); c.stroke();
      const tx = x + h * 0.08, ty = Y - h;
      c.strokeStyle = '#2f8f3a'; c.lineWidth = h * 0.05;
      for (const [dx, dy] of [[-0.4, 0.15], [-0.3, -0.1], [0, -0.2], [0.3, -0.1], [0.42, 0.15]]) {
        c.beginPath(); c.moveTo(tx, ty);
        c.quadraticCurveTo(tx + dx * h * 0.6, ty + (dy - 0.15) * h, tx + dx * h, ty + (dy + 0.12) * h); c.stroke();
      }
    }
    function piirraEspanja(c, W, Y) {
      const m = Math.min(W, Y * 1.3);
      const ax = W * 0.8, ay = Y * 0.3, r = m * 0.09;
      c.strokeStyle = '#ffc400'; c.lineWidth = Math.max(2, r * 0.12); c.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6;
        c.beginPath(); c.moveTo(ax + Math.cos(a) * r * 1.25, ay + Math.sin(a) * r * 1.25);
        c.lineTo(ax + Math.cos(a) * r * 1.6, ay + Math.sin(a) * r * 1.6); c.stroke();
      }
      c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(ax, ay, r, 0, Math.PI * 2); c.fill();
      piirraPalmu(c, W * 0.12, Y, m * 0.45);
      piirraPalmu(c, W * 0.45, Y, m * 0.58);
      piirraPalmu(c, W * 0.72, Y, m * 0.4);
    }
    function piirraPisa(c, W, Y) {
      const h = Math.min(Y * 0.6, W * 0.75), w = h * 0.2, x = W * 0.7;
      c.save();
      c.translate(x, Y);
      c.rotate(0.09);                               // kalteva torni
      const kerrokset = 8, kh = h / kerrokset;
      for (let i = 0; i < kerrokset; i++) {
        const yy = -(i + 1) * kh, ww = i === kerrokset - 1 ? w * 0.7 : w;
        c.fillStyle = i % 2 ? '#efe6d2' : '#e4d9bf';
        c.fillRect(-ww / 2, yy, ww, kh);
        // kaaret
        c.fillStyle = '#b9ab8c';
        const n = 4;
        for (let k = 0; k < n; k++) {
          const ax = -ww / 2 + (k + 0.5) * ww / n;
          c.beginPath(); c.moveTo(ax - ww / n * 0.28, yy + kh * 0.85);
          c.lineTo(ax - ww / n * 0.28, yy + kh * 0.45);
          c.arc(ax, yy + kh * 0.45, ww / n * 0.28, Math.PI, 0);
          c.lineTo(ax + ww / n * 0.28, yy + kh * 0.85); c.closePath(); c.fill();
        }
        // kerroksen reuna
        c.fillStyle = '#cfc2a4';
        c.fillRect(-ww / 2 - w * 0.04, yy, ww + w * 0.08, kh * 0.1);
      }
      c.restore();
    }
    const PAIKAT = [
      { nimi: 'Pariisi',  emoji: '🗼', varit: ['#0055a4', '#ffffff', '#ef4135'], tausta: piirraEiffel },
      { nimi: 'New York', emoji: '🗽', varit: ['#1e3a8a', '#d62828', '#ffffff'], tausta: piirraNewYork },
      { nimi: 'Metsä',    emoji: '🌲', varit: ['#2e7d32', '#7a4a22'],            tausta: piirraMetsa },
      { nimi: 'Ruotsi',   emoji: '🇸🇪', varit: ['#1d5fa8', '#f5c400'],            tausta: piirraRuotsi },
      { nimi: 'Tanska',   emoji: '🇩🇰', varit: ['#c8102e', '#ffffff'],            tausta: piirraTanska },
      { nimi: 'Espanja',  emoji: '🇪🇸', varit: ['#c60b1e', '#ffc400'],            tausta: piirraEspanja },
      { nimi: 'Italia',   emoji: '🇮🇹', varit: ['#009246', '#ffffff', '#ce2b37'], tausta: piirraPisa },
    ];
    let valittuPaikka = PAIKAT[0];

    // ---- Pelin tuntuma ----
    const HYPPY_AIKA = 1.0;          // sekuntia ilmassa
    const HYVA_ALKU = 0.2;           // hyvän hypyn ikkuna (osuus hypystä)
    const HYVA_LOPPU = 0.8;
    const KORKEA_ALKU = 0.3;         // korkea este: tarkempi ikkuna (sääntö 9)
    const KORKEA_LOPPU = 0.65;
    // sääntö 21: pitkä painallus = korkea hyppy
    const HYPPY_MATALA = 0.55;       // lyhyen napautuksen korkeus (osuus täydestä hypystä)
    const HYPPY_KASVU = 0.3;         // sekuntia pitämistä täyteen korkeuteen
    const KORKEA_RAJA = 0.85;        // näin korkea hyppy tarvitaan korkealle esteelle ja okserille
    const OKSERI_VALI = 1.25;        // sekuntia okserin kahden esteen välillä
    const KIELTO_AIKA = 3.0;         // kuinka kauan poni seisoo kieltäytyessään (sääntö 14: tippuminen ja kiipeäminen)

    const kangas = document.getElementById('kangas');
    const ctx = kangas.getContext('2d');
    let L = 0, K = 0; // leveys, korkeus

    function koko() {
      const dpr = window.devicePixelRatio || 1;
      L = window.innerWidth; K = window.innerHeight;
      kangas.width = L * dpr; kangas.height = K * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', koko);
    koko();

    // mitat lasketaan ruudun koosta
    const maaY = () => K * 0.68;
    const poniKoko = () => Math.min(L * 0.22, K * 0.13);
    const poniX = () => L * 0.28;
    const nopeus = () => L * 0.45;       // pikseliä sekunnissa
    const valimatka = () => L * 0.95;
    const esteKork = () => poniKoko() * 0.75;
    const hyppyKork = () => poniKoko() * 1.3;

    // ---- Äänet (säännöt 11–12), tehdään koodilla ----
    let aani = null, kohina = null, kopseAika = 0;
    function avaaAanet() {
      try {
        if (!aani) {
          aani = new (window.AudioContext || window.webkitAudioContext)();
          kohina = aani.createBuffer(1, aani.sampleRate * 0.2, aani.sampleRate);
          const d = kohina.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (aani.state === 'suspended') aani.resume();
      } catch (e) { aani = null; }
    }
    function napsahdus(aika, taajuus, kesto, voimakkuus) {
      const lahde = aani.createBufferSource();
      lahde.buffer = kohina;
      const suodin = aani.createBiquadFilter();
      suodin.type = 'bandpass'; suodin.frequency.value = taajuus; suodin.Q.value = 3;
      const vahvistus = aani.createGain();
      vahvistus.gain.setValueAtTime(voimakkuus, aika);
      vahvistus.gain.exponentialRampToValueAtTime(0.001, aika + kesto);
      lahde.connect(suodin); suodin.connect(vahvistus); vahvistus.connect(aani.destination);
      lahde.start(aika); lahde.stop(aika + kesto + 0.02);
    }
    function puuNaksu(aika, taajuus) {
      const o = aani.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(taajuus, aika);
      o.frequency.exponentialRampToValueAtTime(taajuus * 0.6, aika + 0.12);
      const g = aani.createGain();
      g.gain.setValueAtTime(0.5, aika);
      g.gain.exponentialRampToValueAtTime(0.001, aika + 0.15);
      o.connect(g); g.connect(aani.destination);
      o.start(aika); o.stop(aika + 0.17);
      napsahdus(aika, taajuus * 4, 0.05, 0.6);
    }
    // sääntö 11: puomi putoaa -> "kolks"
    function kolks() {
      if (!aani) return;
      const t = aani.currentTime;
      puuNaksu(t, 420);
      puuNaksu(t + 0.16, 300);
    }
    // sääntö 12: kavioiden kopse laukassa (ta-ta-tam, tauko)
    const KOPSE_KIERROS = 0.42;
    const KOPSE_ISKUT = [0, 0.08, 0.16];
    function kopse(dt, laukkaa) {
      if (!aani) return;
      if (!laukkaa) { kopseAika = 0; return; }
      const ennen = kopseAika;
      kopseAika += dt;
      const vaihe1 = ennen % KOPSE_KIERROS;
      const vaihe2 = vaihe1 + dt;
      for (const isku of KOPSE_ISKUT) {
        if ((ennen === 0 && isku === 0) || (isku > vaihe1 && isku <= vaihe2) || (isku + KOPSE_KIERROS > vaihe1 && isku + KOPSE_KIERROS <= vaihe2)) {
          napsahdus(aani.currentTime, isku === 0.16 ? 600 : 900, 0.06, isku === 0.16 ? 0.9 : 0.6);
        }
      }
    }

    let tila = 'alku'; // alku, valinta, ajo, loppu
    // sääntö 15: ennätys muistetaan localStoragessa
    let ennatys = 0;
    try { ennatys = parseInt(localStorage.getItem('ponitEnnatys'), 10) || 0; } catch (e) {}
    function paivitaEnnatys() {
      if (pisteet > ennatys) {
        ennatys = pisteet;
        try { localStorage.setItem('ponitEnnatys', String(ennatys)); } catch (e) {}
      }
    }
    let askel = 0;
    let pidossa = false, hyppyVoima = 1;
    let taustaSiirto = 0;   // sääntö 24: kuinka paljon tausta on liikkunut
    const TAUSTA_NOPEUS = 0.15;   // tausta liikkuu hitaammin kuin esteet
    let pisteet, kiellot, esteet, maali, hyppyT, ilmassa, kieltoAika, viesti, viestiAika, edellinen;

    function aloita() {
      pisteet = 0; kiellot = 0;
      esteet = [];
      // sääntö 7: arvotaan radan 10 esteen paikat. Okseri vie kaksi paikkaa (sääntö 10).
      let x = L * 1.1;
      const uusi = (laji, xx) => {
        const e = {
          x: xx, laji,
          vari: laji === 'vesi' ? null : valittuPaikka.varit,   // sääntö 23: paikan värit
          tulos: null,       // null, 'hyva', 'puomi', 'polskis', 'kielto'
          odottaa: false,    // poni oli ilmassa kun este tuli kohdalle
          puomiPudotus: 0, haalistus: 1,
        };
        esteet.push(e);
      };
      while (esteet.length < ESTEITA) {
        let laji = LAJIT[Math.floor(Math.random() * LAJIT.length)];
        while (laji === 'okseri' && esteet.length > ESTEITA - 2) {
          laji = LAJIT[Math.floor(Math.random() * LAJIT.length)];
        }
        if (laji === 'okseri') {
          uusi('korkea', x);
          x += nopeus() * OKSERI_VALI;
          uusi('korkea', x);
        } else {
          uusi(laji, x);
        }
        x += valimatka();
      }
      maali = { x };
      hyppyT = 0; ilmassa = false; kieltoAika = 0; tippuuLaskeutuessa = false;
      taustaSiirto = 0;
      viesti = ''; viestiAika = 0;
      tila = 'ajo';
      if (document.activeElement) document.activeElement.blur();
      document.getElementById('alku').classList.add('piilossa');
      document.getElementById('loppu').classList.add('piilossa');
      edellinen = performance.now();
    }

    function hyppaa() {
      if (tila !== 'ajo' || ilmassa || kieltoAika > 0) return;
      ilmassa = true; hyppyT = 0; hyppyVoima = HYPPY_MATALA;
    }

    function naytaViesti(t) { viesti = t; viestiAika = 1.2; }

    function lopeta(maaliin) {
      tila = 'loppu';
      paivitaEnnatys();
      document.getElementById('loppuKuva').textContent = maaliin ? '🏁' : '🛑';
      document.getElementById('loppuOtsikko').textContent = maaliin ? 'Maali!' : 'Peli loppui';
      document.getElementById('loppuTeksti').innerHTML =
        (maaliin ? '' : 'Poni kieltäytyi 3 kertaa.<br>') + 'Pisteet: <b>' + pisteet + '</b> ⭐';
      document.getElementById('loppu').classList.remove('piilossa');
    }

    function paivita(dt) {
      if (viestiAika > 0) viestiAika -= dt;

      // hyppy
      if (ilmassa) {
        // sääntö 21: korkeus kasvaa niin kauan kuin painetaan (hypyn alkuosassa)
        if (pidossa && hyppyT < 0.4) hyppyVoima = Math.min(1, hyppyVoima + dt * (1 - HYPPY_MATALA) / HYPPY_KASVU);
        hyppyT += dt / HYPPY_AIKA;
        if (hyppyT >= 1) { ilmassa = false; hyppyT = 0; }
      }

      // kieltäytyminen: poni seisoo paikallaan
      let liike = nopeus() * dt;
      if (kieltoAika > 0) {
        kieltoAika -= dt;
        liike = 0;
        if (kieltoAika <= 0 && kiellot >= KIELLOT_LOPPU) { lopeta(false); return; }
      }

      taustaSiirto += liike * TAUSTA_NOPEUS;   // sääntö 24: pysähtyy, kun liike = 0

      const px = poniX();
      const nokka = px + Math.max(nopeus() * 0.25, poniKoko() * 0.95); // este ponin nenän edessä

      for (const e of esteet) {
        e.x -= liike;
        if (e.tulos === 'puomi' || e.tulos === 'polskis') {
          e.puomiPudotus = Math.min(1, e.puomiPudotus + dt * 2.5);
        }
        if (e.tulos === 'kielto' && kieltoAika <= 0) {
          e.haalistus = Math.max(0, e.haalistus - dt * 3);
        }
        if (e.tulos !== null) continue;

        // este tulee ponin nenän kohdalle
        if (!e.odottaa && e.x <= nokka) {
          if (!ilmassa) {
            // sääntö 4: ei napautusta -> kieltäytyy, 1 piste
            e.tulos = 'kielto';
            pisteet += PISTEET_KIELTO;
            kiellot++;
            kieltoAika = KIELTO_AIKA;
            naytaViesti('Poni kieltäytyi! 🛑 +' + PISTEET_KIELTO);
            break;
          }
          e.odottaa = true;
        }
        // este on ponin alla: arvioidaan hypyn ajoitus
        if (e.odottaa && e.x <= px) {
          const korkea = e.laji === 'korkea';
          const alku = korkea ? KORKEA_ALKU : HYVA_ALKU;
          const loppu = korkea ? KORKEA_LOPPU : HYVA_LOPPU;
          const p = PISTEET[e.laji];
          const tarpeeksiKorkea = !korkea || hyppyVoima >= KORKEA_RAJA;   // sääntö 21
          if (ilmassa && hyppyT >= alku && hyppyT <= loppu && tarpeeksiKorkea) {
            e.tulos = 'hyva';
            pisteet += p.hyva;                       // säännöt 2, 8, 9
            naytaViesti('Hieno hyppy! ⭐ +' + p.hyva);
          } else if (e.laji === 'vesi') {
            e.tulos = 'polskis';
            pisteet += p.huono;                      // sääntö 8
            naytaViesti('Polskis! 💦 +' + p.huono);
          } else {
            e.tulos = 'puomi';
            pisteet += p.huono;                      // säännöt 3, 9
            naytaViesti('Puomi putosi! +' + p.huono);
            kolks();
            // sääntö 20: ilman satulaa ratsastaja tippuu joka toinen kerta (sattumalta)
            if (!satulaPaalla && Math.random() < 0.5) tippuuLaskeutuessa = true;
          }
        }
      }

      // sääntö 20: tippuminen alkaa, kun poni on laskeutunut. Ei lasketa kieltäytymiseksi.
      if (tippuuLaskeutuessa && !ilmassa && kieltoAika <= 0) {
        tippuuLaskeutuessa = false;
        kieltoAika = KIELTO_AIKA;
        naytaViesti('Ratsastaja tippui! 🤸');
      }

      kopse(dt, !ilmassa && kieltoAika <= 0);   // sääntö 12
      if (!ilmassa && kieltoAika <= 0) askel += dt / KOPSE_KIERROS;   // sääntö 13

      maali.x -= liike;
      if (maali.x <= px) lopeta(true);             // sääntö 5
    }

    function piirraEste(e) {
      if (e.haalistus <= 0 || e.x < -L * 0.3 || e.x > L * 1.5) return;
      if (e.laji === 'vesi') { piirraVesi(e); return; }
      const y0 = maaY();
      const h = e.laji === 'korkea' ? esteKork() * 1.4 : esteKork();
      const lev = poniKoko() * 0.7;
      const tolppa = Math.max(6, lev * 0.12);
      ctx.save();
      ctx.globalAlpha = e.haalistus;
      // tolpat
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1.5;
      for (const sx of [e.x - lev / 2, e.x + lev / 2]) {
        ctx.fillRect(sx - tolppa / 2, y0 - h * 1.15, tolppa, h * 1.15);
        ctx.strokeRect(sx - tolppa / 2, y0 - h * 1.15, tolppa, h * 1.15);
      }
      // puomit: alempi ja ylempi
      piirraPuomi(e.x, y0 - h * 0.45, lev, e.vari, 0);
      if (e.tulos === 'puomi') {
        const p = e.puomiPudotus;
        const y = (y0 - h) + p * (h - poniKoko() * 0.06);
        piirraPuomi(e.x + p * lev * 0.15, y, lev, e.vari, p * 0.35);
      } else {
        piirraPuomi(e.x, y0 - h, lev, e.vari, 0);
      }
      ctx.restore();
    }

    function piirraVesi(e) {
      const y0 = maaY();
      const lev = poniKoko() * 1.1;
      const kork = Math.max(10, poniKoko() * 0.14);
      ctx.save();
      ctx.globalAlpha = e.haalistus;
      // vesiallas
      ctx.fillStyle = '#1e88e5';
      ctx.beginPath();
      ctx.ellipse(e.x, y0 + kork * 0.3, lev / 2, kork, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(e.x - lev * 0.25, y0 + kork * 0.1, lev * 0.18, 3);
      ctx.fillRect(e.x + lev * 0.05, y0 + kork * 0.5, lev * 0.2, 3);
      // roiske, kun poni astuu veteen
      if (e.tulos === 'polskis' && e.puomiPudotus < 1) {
        const s = poniKoko() * 0.5;
        ctx.globalAlpha = e.haalistus * (1 - e.puomiPudotus);
        ctx.font = s + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('💦', e.x - s * 0.4, y0 - e.puomiPudotus * s);
        ctx.fillText('💦', e.x + s * 0.4, y0 - e.puomiPudotus * s * 0.7);
      }
      ctx.restore();
    }

    function piirraPuomi(cx, cy, lev, vari, kulma) {
      const pk = Math.max(6, poniKoko() * 0.08);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(kulma);
      const osat = 6;
      for (let i = 0; i < osat; i++) {
        ctx.fillStyle = vari[i % vari.length];
        ctx.fillRect(-lev / 2 - pk + i * (lev + 2 * pk) / osat, -pk / 2, (lev + 2 * pk) / osat + 0.5, pk);
      }
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      ctx.strokeRect(-lev / 2 - pk, -pk / 2, lev + 2 * pk, pk);
      ctx.restore();
    }

    // ---- Itse piirretty poni ja ratsastaja ----
    // x, y = kohta maassa ponin keskellä. Poni katsoo oikealle.
    // sääntö 16: kuusi ponia (värit määrittelyn kohdasta Ulkonäkö)
    const PONIT = [
      { nimi: 'Tuuli',       runko: '#f4f4f0', taka: '#d2d2cc', harja: ['#9a9a9a'], silma: '#222' },
      { nimi: 'Barbi',       runko: '#8b5a2b', taka: '#6b4420', harja: ['#f0dca0'] },
      { nimi: 'Pikku Mimmi', runko: '#7a4a26', taka: '#5c371c', harja: ['#ffffff'], laikut: '#ffffff', koko: 0.67 },
      { nimi: 'Manu',        runko: '#c99d6e', taka: '#a37d54', harja: ['#9a9a9a', '#ffffff'], laikut: '#ffffff', koko: 0.67 },
      { nimi: 'Alli',        runko: '#4a2c17', taka: '#33200f', harja: ['#c99d6e'] },
      { nimi: 'Edvin',       runko: '#2a2a2a', taka: '#151515', harja: ['#000000'] },
    ];
    let valittuPoni = PONIT[5];
    let satulaPaalla = true;     // sääntö 19
    let tippuuLaskeutuessa = false;   // sääntö 20: ratsastaja tippuu, kun poni on maassa
    const TAKKI = '#ff7eb6', HOUSUT = '#f4efe6', IHO = '#f2c9a0', KYPARA = '#111111';

    function jalka(c, s, lx, ly, a, b, vari) {
      // a = reiden kulma, b = säären kulma (0 = suoraan alas, + = eteenpäin)
      const y1 = 0.28 * s, y2 = 0.30 * s;
      const kx = lx + Math.sin(a) * y1, ky = ly + Math.cos(a) * y1;
      const hx = kx + Math.sin(b) * y2, hy = ky + Math.cos(b) * y2;
      c.strokeStyle = vari; c.lineCap = 'round';
      c.lineWidth = 0.09 * s;
      c.beginPath(); c.moveTo(lx, ly); c.lineTo(kx, ky); c.stroke();
      c.lineWidth = 0.065 * s;
      c.beginPath(); c.moveTo(kx, ky); c.lineTo(hx, hy); c.stroke();
      c.fillStyle = '#000';                       // kavio
      c.beginPath(); c.arc(hx, hy, 0.04 * s, 0, Math.PI * 2); c.fill();
    }

    function jalanKulmat(asento, vaihe, etu, vasen) {
      if (asento === 'seisoo') return etu ? [0.05, 0] : [-0.05, 0];
      if (asento === 'ilmassa') {
        if (etu) return vasen ? [1.2, -0.7] : [1.0, -0.9];   // etujalat koukussa
        return vasen ? [-0.7, -1.3] : [-0.6, -1.1];          // takajalat taakse koukkuun
      }
      // laukka: jokainen jalka liikkuu vähän eri tahdissa
      const siirto = (etu ? 0.45 : 0) + (vasen ? 0 : 0.12);
      const f = (vaihe + siirto) * Math.PI * 2;
      const a = 0.5 * Math.sin(f);
      const koukku = 0.9 * Math.max(0, Math.cos(f));
      return [a, a - koukku];
    }

    // sääntö 18: shetlanninponit (koko 0.67) ovat kaksi kolmasosaa muista, ratsastaja pysyy isona
    function piirraPoni(c, x, y, sIso, asento, askel, ratsastajaMukana = true, pv = valittuPoni) {
      const s = sIso * (pv.koko || 1);
      const PONI = pv.runko, PONI_TAKA = pv.taka, HARJA = pv.harja[0];
      const harjaVari = (i) => pv.harja[i % pv.harja.length];
      const vaihe = askel % 1;
      const pomppu = asento === 'laukka' ? -Math.abs(Math.sin(vaihe * Math.PI * 2)) * 0.04 * s : 0;
      const kallistus = asento === 'ilmassa' ? -0.12 : 0;
      c.save();
      c.translate(x, y + pomppu);
      c.rotate(kallistus);
      const lantio = [-0.26 * s, -0.6 * s], lapa = [0.24 * s, -0.6 * s];

      // kaukaiset jalat (tummemmat)
      let k = jalanKulmat(asento, vaihe, false, false); jalka(c, s, lantio[0], lantio[1], k[0], k[1], PONI_TAKA);
      k = jalanKulmat(asento, vaihe, true, false);      jalka(c, s, lapa[0], lapa[1], k[0], k[1], PONI_TAKA);

      // häntä
      const heilahdus = asento === 'laukka' ? Math.sin(vaihe * Math.PI * 2) * 0.05 * s : 0;
      c.strokeStyle = HARJA; c.lineCap = 'round'; c.lineWidth = 0.07 * s;
      c.beginPath(); c.moveTo(-0.34 * s, -0.7 * s);
      c.quadraticCurveTo(-0.55 * s, -0.68 * s + heilahdus, -0.58 * s, -0.42 * s + heilahdus); c.stroke();
      c.lineWidth = 0.035 * s; c.strokeStyle = harjaVari(1);
      c.beginPath(); c.moveTo(-0.34 * s, -0.7 * s);
      c.quadraticCurveTo(-0.5 * s, -0.6 * s + heilahdus, -0.5 * s, -0.4 * s + heilahdus); c.stroke();

      // vartalo
      c.fillStyle = PONI;
      c.beginPath(); c.ellipse(0, -0.66 * s, 0.37 * s, 0.16 * s, 0, 0, Math.PI * 2); c.fill();
      // kaula
      c.beginPath();
      c.moveTo(0.16 * s, -0.76 * s);
      c.lineTo(0.40 * s, -1.05 * s);
      c.lineTo(0.52 * s, -0.98 * s);
      c.lineTo(0.36 * s, -0.58 * s);
      c.closePath(); c.fill();
      // pää
      c.beginPath(); c.ellipse(0.55 * s, -0.95 * s, 0.14 * s, 0.07 * s, 0.55, 0, Math.PI * 2); c.fill();
      // korvat
      c.beginPath();
      c.moveTo(0.41 * s, -1.04 * s); c.lineTo(0.43 * s, -1.15 * s); c.lineTo(0.47 * s, -1.05 * s);
      c.closePath(); c.fill();
      // kirjavat laikut
      if (pv.laikut) {
        c.save();
        c.beginPath(); c.ellipse(0, -0.66 * s, 0.37 * s, 0.16 * s, 0, 0, Math.PI * 2);
        c.moveTo(0.16 * s, -0.76 * s); c.lineTo(0.40 * s, -1.05 * s); c.lineTo(0.52 * s, -0.98 * s); c.lineTo(0.36 * s, -0.58 * s); c.closePath();
        c.clip();
        c.fillStyle = pv.laikut;
        c.beginPath(); c.ellipse(-0.18 * s, -0.62 * s, 0.13 * s, 0.11 * s, 0.4, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(0.12 * s, -0.56 * s, 0.11 * s, 0.07 * s, -0.3, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(0.36 * s, -0.78 * s, 0.07 * s, 0.12 * s, 0.6, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(-0.32 * s, -0.74 * s, 0.06 * s, 0.05 * s, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      // silmä
      c.fillStyle = pv.silma || '#fff';
      c.beginPath(); c.arc(0.52 * s, -0.99 * s, 0.018 * s, 0, Math.PI * 2); c.fill();
      // harja
      c.strokeStyle = HARJA; c.lineWidth = 0.06 * s;
      c.beginPath(); c.moveTo(0.42 * s, -1.06 * s); c.lineTo(0.17 * s, -0.78 * s); c.stroke();
      c.lineWidth = 0.025 * s;
      for (let i = 0; i < 4; i++) {
        c.strokeStyle = harjaVari(i);
        const t = i / 3;
        const hx = 0.4 * s - t * 0.2 * s, hy = -1.03 * s + t * 0.23 * s;
        c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx - 0.07 * s, hy + 0.02 * s + heilahdus * 0.3); c.stroke();
      }

      // lähimmät jalat
      k = jalanKulmat(asento, vaihe, false, true); jalka(c, s, lantio[0], lantio[1], k[0], k[1], PONI);
      k = jalanKulmat(asento, vaihe, true, true);  jalka(c, s, lapa[0], lapa[1], k[0], k[1], PONI);

      // satula (sääntö 19: ilman satulaa sitä ei piirretä)
      if (satulaPaalla) {
        c.fillStyle = '#7a4a22';
        c.beginPath(); c.ellipse(0.0, -0.8 * s, 0.13 * s, 0.045 * s, 0, 0, Math.PI * 2); c.fill();
      }

      // ratsastaja
      if (ratsastajaMukana) {
        c.save();
        c.translate(0, -0.84 * s);
        piirraRatsastaja(c, sIso, asento === 'ilmassa' ? 0.35 : 0.15, pv.koko || 1);
        c.restore();
      }

      c.restore();
    }

    // ratsastaja piirretään niin, että lonkka on kohdassa (0, 0)
    // seisoo = null: istuu satulassa; seisoo = luku: seisoo, ja luku on jalkojen heilahdus (kävely)
    function piirraRatsastaja(c, s, nojaa, ohjat, seisoo = null) {
      const olka = [Math.sin(nojaa) * 0.26 * s, -Math.cos(nojaa) * 0.26 * s];
      c.lineCap = 'round';
      if (seisoo === null) {
        // jalka ja saapas (istuu)
        c.strokeStyle = HOUSUT; c.lineWidth = 0.07 * s;
        c.beginPath(); c.moveTo(0, 0); c.lineTo(0.12 * s, 0.14 * s); c.stroke();
        c.strokeStyle = '#111'; c.lineWidth = 0.06 * s;
        c.beginPath(); c.moveTo(0.12 * s, 0.14 * s); c.lineTo(0.06 * s, 0.29 * s); c.stroke();
      } else {
        // kaksi suoraa jalkaa, jotka heiluvat kävellessä
        for (const suunta of [1, -1]) {
          const a = seisoo * suunta;
          const px = Math.sin(a) * 0.17 * s, py = Math.cos(a) * 0.17 * s;
          const sx = px + Math.sin(a) * 0.15 * s, sy = py + Math.cos(a) * 0.15 * s;
          c.strokeStyle = HOUSUT; c.lineWidth = 0.065 * s;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(px, py); c.stroke();
          c.strokeStyle = '#111'; c.lineWidth = 0.06 * s;
          c.beginPath(); c.moveTo(px, py); c.lineTo(sx, sy); c.stroke();
        }
      }
      // vartalo (vaaleanpunainen takki)
      c.strokeStyle = TAKKI; c.lineWidth = 0.12 * s;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(olka[0], olka[1]); c.stroke();
      // käsi ja ohjat
      const k = ohjat === true ? 1 : (ohjat || 1);   // ohjat = ponin koko (pienellä ponilla pienemmät ohjat)
      const kasi = ohjat ? [(0.15 + 0.12 * k) * s, -0.06 * s * k] : [olka[0] + 0.18 * s, olka[1] - 0.1 * s];
      c.lineWidth = 0.05 * s;
      c.beginPath(); c.moveTo(olka[0], olka[1]); c.lineTo(kasi[0], kasi[1]); c.stroke();
      if (ohjat) {
        c.strokeStyle = '#5a3412'; c.lineWidth = Math.max(1, 0.012 * s * k);
        c.beginPath(); c.moveTo(kasi[0], kasi[1]); c.lineTo(0.62 * s * k, -0.06 * s * k); c.stroke();
      }
      // pää ja kypärä
      const pa = [olka[0] + 0.03 * s, olka[1] - 0.1 * s];
      c.fillStyle = IHO;
      c.beginPath(); c.arc(pa[0], pa[1], 0.075 * s, 0, Math.PI * 2); c.fill();
      c.fillStyle = KYPARA;
      c.beginPath(); c.arc(pa[0], pa[1] - 0.01 * s, 0.082 * s, Math.PI, 0); c.fill();
      c.fillRect(pa[0], pa[1] - 0.04 * s, 0.1 * s, 0.022 * s);   // lippa
    }

    // sääntö 14: kieltäytyessä ratsastaja tippuu, nousee seisomaan,
    // kävelee ponin luo ja hyppää satulaan
    function piirraTippuva(c, hx, y0, s, q) {
      const satula = [hx, y0 - 0.84 * s * (valittuPoni.koko || 1)];
      const maa = [hx + 0.75 * s, y0 - 0.06 * s];          // makaa maassa (lonkka)
      const pysty = [maa[0], y0 - 0.32 * s];                // seisoo samassa kohdassa
      const ponilla = [hx + 0.12 * s, y0 - 0.32 * s];       // seisoo ponin vieressä
      const pehmea = t => t * t * (3 - 2 * t);
      const valilla = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      let paikka, kulma = 0, seisoo = 0, kaannetty = false, nojaa = 0.05;
      if (q < 0.2) {                 // 1. tippuu eteenpäin
        const t = pehmea(q / 0.2);
        paikka = valilla(satula, maa, t);
        paikka[1] -= Math.sin(t * Math.PI) * 0.3 * s;
        kulma = t * Math.PI / 2;
        seisoo = null; nojaa = 0.15;
      } else if (q < 0.35) {         // 2. makaa maassa
        paikka = maa; kulma = Math.PI / 2;
      } else if (q < 0.5) {          // 3. nousee seisomaan
        const t = pehmea((q - 0.35) / 0.15);
        paikka = valilla(maa, pysty, t);
        kulma = (1 - t) * Math.PI / 2;
      } else if (q < 0.8) {          // 4. kävelee ponin luo
        const t = (q - 0.5) / 0.3;
        paikka = valilla(pysty, ponilla, t);
        paikka[1] -= Math.abs(Math.sin(t * Math.PI * 4)) * 0.02 * s;
        seisoo = Math.sin(t * Math.PI * 4) * 0.4;
        kaannetty = true;            // katsoo ponia kohti
      } else {                       // 5. hyppää satulaan
        const t = pehmea((q - 0.8) / 0.2);
        paikka = valilla(ponilla, satula, t);
        paikka[1] -= Math.sin(t * Math.PI) * 0.25 * s;
        seisoo = t < 0.5 ? 0 : null; nojaa = 0.15;
      }
      c.save();
      c.translate(paikka[0], paikka[1]);
      c.rotate(kulma);
      if (kaannetty) c.scale(-1, 1);
      piirraRatsastaja(c, s, nojaa, false, seisoo);
      c.restore();
    }

    function piirra() {
      const y0 = maaY();
      // taivas
      ctx.fillStyle = '#7ec8f5';
      ctx.fillRect(0, 0, L, y0);
      // sääntö 23: paikan taustakuva
      if (tila !== 'alku' && tila !== 'paikka') {
        ctx.save(); ctx.globalAlpha = 0.6;          // vähän haalea, niin esteet erottuvat
        // sääntö 24: kaksi kuvaa peräkkäin, niin tausta tulee uudestaan toiselta puolelta
        const off = taustaSiirto % L;
        for (const dx of [-off, L - off]) {
          ctx.save(); ctx.translate(dx, 0);
          valittuPaikka.tausta(ctx, L, y0);
          ctx.restore();
        }
        ctx.restore();
      }
      // hiekkakenttä
      ctx.fillStyle = '#d9b77a';
      ctx.fillRect(0, y0, L, K - y0);
      ctx.fillStyle = '#c9a265';
      ctx.fillRect(0, y0, L, 4);

      if (tila === 'alku' || ((tila === 'paikka' || tila === 'valinta' || tila === 'satula') && !esteet)) return;

      for (const e of esteet) piirraEste(e);

      // maali 🏁
      if (maali.x < L * 1.5) {
        ctx.font = poniKoko() * 0.9 + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('🏁', maali.x, y0);
      }

      // poni ja ratsastaja (sääntö 13)
      const s = poniKoko();
      const nousu = ilmassa ? Math.sin(hyppyT * Math.PI) * hyppyKork() * hyppyVoima : 0;
      let heilu = 0;
      if (kieltoAika > 0) heilu = Math.sin(kieltoAika * 30) * s * 0.04;
      const asento = ilmassa ? 'ilmassa' : (kieltoAika > 0 ? 'seisoo' : 'laukka');
      const tippuu = kieltoAika > 0;
      piirraPoni(ctx, poniX() + heilu, y0 - nousu, s * 1.1, asento, askel, !tippuu);
      if (tippuu) piirraTippuva(ctx, poniX() + heilu, y0, s * 1.1, 1 - kieltoAika / KIELTO_AIKA);

      // pisteet
      ctx.fillStyle = '#3a2a10';
      ctx.font = 'bold ' + Math.max(24, L * 0.07) + 'px system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      paivitaEnnatys();
      const pisteTeksti = '⭐ ' + pisteet;
      ctx.fillText(pisteTeksti, 16, 16);
      ctx.fillText('🏆 ' + ennatys, 16 + ctx.measureText(pisteTeksti).width + 28, 16);
      // sääntö 17: valitun ponin nimi
      ctx.font = 'bold ' + Math.max(20, L * 0.055) + 'px system-ui, sans-serif';
      ctx.fillText('🐴 ' + valittuPoni.nimi, 16, 16 + Math.max(24, L * 0.07) + 10);

      // viesti
      if (viestiAika > 0) {
        ctx.font = 'bold ' + Math.max(22, L * 0.065) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        const w = ctx.measureText(viesti).width + 32;
        const vy = K * 0.25;
        ctx.fillRect(L / 2 - w / 2, vy - 30, w, 60);
        ctx.fillStyle = '#3a2a10';
        ctx.fillText(viesti, L / 2, vy);
      }
    }

    function silmukka(nyt) {
      if (tila === 'ajo') {
        const dt = Math.min(0.05, (nyt - edellinen) / 1000);
        edellinen = nyt;
        paivita(dt);
      }
      piirra();
      requestAnimationFrame(silmukka);
    }
    requestAnimationFrame(silmukka);

    // aloitusruudun kuva: seisova poni
    (function () {
      const kv = document.getElementById('kuvake');
      const dpr = window.devicePixelRatio || 1;
      kv.width = 200 * dpr; kv.height = 170 * dpr;
      const c2 = kv.getContext('2d');
      c2.setTransform(dpr, 0, 0, dpr, 0, 0);
      piirraPoni(c2, 95, 165, 115, 'seisoo', 0);
    })();

    // ohjaus: napautus, hiiri tai välilyönti / nuoli ylös
    kangas.addEventListener('pointerdown', (ev) => { ev.preventDefault(); pidossa = true; hyppaa(); });
    window.addEventListener('pointerup', () => { pidossa = false; });
    window.addEventListener('pointercancel', () => { pidossa = false; });
    window.addEventListener('keyup', (ev) => {
      if (ev.code === 'Space' || ev.code === 'ArrowUp') pidossa = false;
    });
    window.addEventListener('keydown', (ev) => {
      if (ev.code === 'Space' || ev.code === 'ArrowUp') { ev.preventDefault(); pidossa = true; hyppaa(); }
    });
    // sääntö 1 ja 16: Aloita-napista tulee ensin ponin valinta
    // sääntö 22: Aloita-napista tulee ensin paikan valinta
    function naytaPaikat() {
      avaaAanet();
      tila = 'paikka';
      document.getElementById('alku').classList.add('piilossa');
      document.getElementById('loppu').classList.add('piilossa');
      document.getElementById('paikkaRuutu').classList.remove('piilossa');
    }
    function naytaValinta() {
      tila = 'valinta';
      document.getElementById('paikkaRuutu').classList.add('piilossa');
      document.getElementById('valinta').classList.remove('piilossa');
    }
    document.getElementById('aloitaNappi').addEventListener('click', naytaPaikat);
    document.getElementById('uudestaanNappi').addEventListener('click', naytaPaikat);

    // paikkakortit
    (function () {
      const rivi = document.getElementById('paikkarivi');
      const dpr = window.devicePixelRatio || 1;
      PAIKAT.forEach((pk) => {
        const nappi = document.createElement('button');
        nappi.className = 'ponikortti';
        const kv = document.createElement('canvas');
        kv.width = 120 * dpr; kv.height = 100 * dpr;
        const c2 = kv.getContext('2d');
        c2.setTransform(dpr, 0, 0, dpr, 0, 0);
        c2.fillStyle = '#7ec8f5'; c2.fillRect(0, 0, 120, 82);
        pk.tausta(c2, 120, 82);
        c2.fillStyle = '#d9b77a'; c2.fillRect(0, 82, 120, 18);
        const nimi = document.createElement('span');
        nimi.textContent = pk.emoji + ' ' + pk.nimi;
        nappi.appendChild(kv); nappi.appendChild(nimi);
        nappi.addEventListener('click', () => { valittuPaikka = pk; naytaValinta(); });
        rivi.appendChild(nappi);
      });
    })();

    // sääntö 19: satulan kanssa vai ilman
    function valitseSatula(paalla) {
      satulaPaalla = paalla;
      document.getElementById('satulaRuutu').classList.add('piilossa');
      aloita();
    }
    document.getElementById('satulaKanssa').addEventListener('click', () => valitseSatula(true));
    document.getElementById('satulaIlman').addEventListener('click', () => valitseSatula(false));

    // ponikortit valintaruudulle
    (function () {
      const rivi = document.getElementById('ponirivi');
      const dpr = window.devicePixelRatio || 1;
      PONIT.forEach((pv) => {
        const nappi = document.createElement('button');
        nappi.className = 'ponikortti';
        const kv = document.createElement('canvas');
        kv.width = 120 * dpr; kv.height = 100 * dpr;
        const c2 = kv.getContext('2d');
        c2.setTransform(dpr, 0, 0, dpr, 0, 0);
        piirraPoni(c2, 58, 97, 68, 'seisoo', 0, true, pv);
        const nimi = document.createElement('span');
        nimi.textContent = pv.nimi;
        nappi.appendChild(kv); nappi.appendChild(nimi);
        nappi.addEventListener('click', () => {
          valittuPoni = pv;
          tila = 'satula';
          document.getElementById('valinta').classList.add('piilossa');
          document.getElementById('satulaRuutu').classList.remove('piilossa');
        });
        rivi.appendChild(nappi);
      });
    })();
    document.addEventListener('touchmove', (ev) => ev.preventDefault(), { passive: false });
  </script>
</body>
